<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8d8b8" />
    <!-- Title, description & Open Graph tags are filled from src/config/wedding.ts at build time (see vite.config.ts) -->
    <title>%WEDDING_TITLE%</title>
    <meta name="description" content="%WEDDING_DESCRIPTION%" />
    <link rel="canonical" href="%WEDDING_URL%" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%WEDDING_TITLE%" />
    <meta property="og:description" content="%WEDDING_DESCRIPTION%" />
    <meta property="og:url" content="%WEDDING_URL%" />
    <meta property="og:image" content="%WEDDING_OG_IMAGE%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%WEDDING_TITLE%" />
    <meta name="twitter:description" content="%WEDDING_DESCRIPTION%" />
    <meta name="twitter:image" content="%WEDDING_OG_IMAGE%" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Great+Vibes&family=Playball&family=Cormorant+SC:wght@500;600&family=Tiro+Devanagari+Hindi:ital@0;1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Please enable JavaScript to view this wedding invitation.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
